<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>Online Attendance Biometrics</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(
        145deg,
        #064c3a 0%,
        #087057 100%
      );
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 38px 26px;
      background: #ffffff;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.20);
    }

    .office {
      color: #678078;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      color: #153f33;
      font-size: 29px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 16px 0 30px;
      color: #71837d;
      font-size: 14px;
      line-height: 1.6;
    }

    .open-button {
      display: block;
      width: 100%;
      padding: 17px 20px;
      background: #087057;
      color: #ffffff;
      text-decoration: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
    }

    .open-button:hover {
      background: #075f4b;
    }

    .note {
      margin-top: 22px;
      color: #93a19c;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="office">
      DSWD FIELD OFFICE XII
    </div>

    <h1>
      Online Attendance Biometrics
    </h1>

    <div class="subtitle">
      Attendance, GPS verification,
      Email confirmation and Daily Time Record.
    </div>

    <a
      class="open-button"
      href="https://script.google.com/macros/s/AKfycbyZ9rZ3D97zGimbDv1AEo7fXhgC1P6h4KL-i3_OdC9tXROup2kSqNiya0npMcECKgY/exec"
    >
      OPEN ATTENDANCE SYSTEM
    </a>

    <div class="note">
      Authorized Supplementary Feeding Program Office Attendance System
    </div>

  </div>

</body>
</html>
